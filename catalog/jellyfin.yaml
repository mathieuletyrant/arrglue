kind: jellyfin
family: media
detect:
  images: ["*/jellyfin", "jellyfin"]
  binaries: [jellyfin]
  systemd: [jellyfin.service]
ports: { http: 8096 }
config:
  # linuxserver: config dir = /config ; official image: /config/config
  paths: [/config/network.xml, /config/config/network.xml, /etc/jellyfin/network.xml]
  format: xml
  fields:
    port: /NetworkConfiguration/InternalHttpPort
    url_base: /NetworkConfiguration/BaseUrl
# the api key lives in jellyfin.db: any key works, one named "arrglue" is preferred
secret:
  paths: [/config/data/data/jellyfin.db, /config/data/jellyfin.db, /var/lib/jellyfin/data/jellyfin.db]
  sqlite: SELECT AccessToken FROM ApiKeys ORDER BY (Name = 'arrglue') DESC, Id DESC
health:
  # authenticated on purpose: a wrong key shows up in doctor, not later in a connector
  path: /System/Info
  # Jellyfin 12 may refuse the legacy X-Emby-Token header: use the official scheme
  auth: { header: Authorization, format: 'MediaBrowser Token="%s"' }
  version_field: Version
